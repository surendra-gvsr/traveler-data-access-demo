[project]
name = "traveler-data-access-demo"
version = "0.1.0"
description = "Governed, AI-safe access to traveler data: consent, PII removal, provenance and audit at the MCP boundary."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "mcp>=1.2",
]

[project.optional-dependencies]
demo = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
