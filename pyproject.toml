[project]
name = "traveler-data-access-demo"
version = "0.1.0"
description = "Governed, AI-safe access to traveler data: consent, PII removal, provenance and audit at the MCP boundary."
requires-python = ">=3.11"
# Upper bounds are deliberate. This code is written against the v1 MCP API and
# Pydantic v2; an unbounded floor installs whatever is newest, which is how a clean
# checkout picked up mcp 2.x — where `FastMCP` is renamed `MCPServer` — and failed to
# import at all, while a developer machine with 1.x pinned by history kept working.
dependencies = [
    "pydantic>=2.6,<3",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
# 2.3 is a real floor, not politeness: demo/ask_claude.py passes `cache_control`
# as a top-level parameter, which older SDKs reject.
demo = ["anthropic>=2.3,<3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
